<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProFit</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',sans-serif}
:root{--bg:#0a0e1a;--bg2:#111827;--card:#1a2233;--bd:rgba(148,163,184,.15);--tx:#f1f5f9;--tx2:#94a3b8;--tm:#64748b;--bl:#3b82f6;--gr:#10b981;--rd:#f43f5e;--am:#f59e0b;--pu:#a855f7}
[data-theme=light]{--bg:#f1f5f9;--bg2:#fff;--card:#fff;--bd:rgba(148,163,184,.25);--tx:#0f172a;--tx2:#475569}
body{background:var(--bg);color:var(--tx);min-height:100vh;padding:16px}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);cursor:pointer;font-family:inherit;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn:hover{border-color:var(--bl);transform:translateY(-1px)}
.btn.primary{background:var(--bl);color:#fff;border-color:var(--bl)}
.btn.success{background:var(--gr);color:#fff;border-color:var(--gr)}
.btn.danger{background:rgba(244,63,94,.15);color:#fda4af;border-color:rgba(244,63,94,.3)}
.btn.admin{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none}
.btn.coach{background:linear-gradient(135deg,#3b82f6,#a855f7);color:#fff;border:none}
.btn:disabled{opacity:.6;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-family:inherit;font-size:.92rem;font-weight:600;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
label{display:block;font-size:.78rem;font-weight:700;color:var(--tx2);margin-bottom:6px}
.auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0a0e1a,#1a1f35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;overflow-y:auto}
.auth-card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:32px 28px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5);margin:auto}
.auth-logo{font-size:3.5rem;text-align:center;margin-bottom:8px}
.auth-title{text-align:center;font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.auth-sub{text-align:center;font-size:.85rem;color:var(--tx2);margin-bottom:22px}
.auth-err{color:#fda4af;font-size:.82rem;text-align:center;font-weight:700;min-height:20px;margin-top:10px}
.role-picker{display:flex;gap:8px;margin-bottom:14px}
.role-btn{flex:1;padding:14px 8px;border-radius:12px;border:2px solid var(--bd);background:var(--bg2);color:var(--tx2);cursor:pointer;font-family:inherit;font-weight:700;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
.role-btn.selected{border-color:transparent;color:#fff}
.role-btn[data-role=student].selected{background:linear-gradient(135deg,#10b981,#059669)}
.role-btn[data-role=coach].selected{background:linear-gradient(135deg,#3b82f6,#a855f7)}
.role-btn .ric{font-size:1.5rem}
.header{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:1.15rem;font-weight:900;flex:1}
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:30px;background:var(--bg2);border:1px solid var(--bd);cursor:pointer;font-family:inherit;color:var(--tx);font-weight:700;font-size:.85rem}
.user-chip .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
.toolbar{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;width:480px;max-width:96vw;background:var(--card);z-index:101;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.4,0,.2,1)}
.drawer.right{right:0;transform:translateX(110%);border-left:1px solid var(--bd)}
.drawer.left{left:0;transform:translateX(-110%);border-right:1px solid var(--bd)}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(168,85,247,.08))}
.drawer-header h2{font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:8px}
.close-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.close-btn:hover{background:var(--rd);color:#fff;border-color:var(--rd)}
.drawer-tabs{display:flex;border-bottom:1px solid var(--bd);overflow-x:auto;padding:0 22px}
.tab{padding:13px 16px;border:none;background:transparent;color:var(--tx2);font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.tab.active{color:var(--bl);border-bottom-color:var(--bl)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px}
.drawer-body.hidden{display:none}
.u-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);margin-bottom:10px}
.u-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-weight:800;font-size:.92rem;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-meta{font-size:.7rem;color:var(--tm)}
.u-actions{display:flex;gap:5px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .2s;font-family:inherit}
.icon-btn:hover{background:var(--bl);color:#fff;border-color:var(--bl)}
.icon-btn.del:hover{background:var(--rd);border-color:var(--rd)}
.icon-btn.approve:hover{background:var(--gr);border-color:var(--gr)}
.icon-btn.reject:hover{background:var(--rd);border-color:var(--rd)}
.badge{padding:3px 9px;border-radius:20px;font-size:.68rem;font-weight:800;display:inline-block}
.badge.admin{background:rgba(245,158,11,.2);color:#fbbf24}
.badge.coach{background:rgba(59,130,246,.2);color:#60a5fa}
.badge.student{background:rgba(16,185,129,.2);color:#34d399}
.badge.pending{background:rgba(245,158,11,.2);color:#fbbf24}
.badge.rejected{background:rgba(244,63,94,.2);color:#fda4af}
.badge.inactive{background:rgba(100,116,139,.25);color:#94a3b8}
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:92vw}
.toast{padding:12px 20px;border-radius:12px;font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:slideIn .35s ease;pointer-events:auto}
.toast.success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.toast.error{background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff}
.toast.info{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
.empty{text-align:center;padding:40px 20px;color:var(--tm)}
.empty .icon{font-size:2.5rem;margin-bottom:12px}
.form-row{margin-bottom:12px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--bd);margin:16px 0}
@media (max-width:600px){
  body{padding:10px}
  .drawer{width:100vw}
  .header h1{font-size:1rem}
}
</style>
</head>
<body>
<div class="toasts" id="toasts"></div>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card" id="loginView">
    <div class="auth-logo">🏋️</div>
    <div class="auth-title">ProFit</div>
    <div class="auth-sub">برای ادامه وارد شوید</div>
    <div class="form-row"><label>نام کاربری</label><input type="text" id="loginUser" dir="ltr" autocomplete="username"></div>
    <div class="form-row"><label>رمز عبور</label><input type="password" id="loginPass" dir="ltr" autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()" id="loginBtn">ورود</button>
    <div class="auth-err" id="loginErr"></div>
    <div class="divider"></div>
    <button class="btn" style="width:100%;justify-content:center" onclick="showRegister()">✨ حساب ندارید؟ ثبت‌نام</button>
  </div>

  <div class="auth-card hidden" id="registerView">
    <div class="auth-logo">✨</div>
    <div class="auth-title">ثبت‌نام</div>
    <div class="auth-sub">نوع حساب را انتخاب کنید</div>
    <div class="role-picker">
      <button type="button" class="role-btn selected" data-role="student" onclick="pickRole('student')"><span class="ric">🎓</span><span>شاگرد</span></button>
      <button type="button" class="role-btn" data-role="coach" onclick="pickRole('coach')"><span class="ric">👨‍🏫</span><span>مربی</span></button>
    </div>
    <div id="roleHint" style="text-align:center;font-size:.75rem;color:var(--tm);margin-bottom:14px">حساب شاگرد بلافاصله فعال می‌شود</div>
    <div class="form-row"><label>نام کاربری (انگلیسی)</label><input type="text" id="regUser" dir="ltr" placeholder="ali_ahmadi"></div>
    <div class="form-row"><label>نام نمایشی</label><input type="text" id="regName" placeholder="علی احمدی"></div>
    <div class="form-row"><label>رمز (حداقل ۶ کاراکتر)</label><input type="password" id="regPass" dir="ltr"></div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="doRegister()" id="regBtn">✅ ایجاد حساب</button>
    <div class="auth-err" id="regErr"></div>
    <div class="divider"></div>
    <button class="btn" style="width:100%;justify-content:center" onclick="showLogin()">← بازگشت به ورود</button>
  </div>

  <div class="auth-card hidden" id="pendingView">
    <div class="auth-logo">⏳</div>
    <div class="auth-title">در انتظار تأیید</div>
    <div class="auth-sub">حساب مربی ساخته شد</div>
    <div style="background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(217,119,6,.05));border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:18px;text-align:center;margin-bottom:20px">
      <div style="font-size:2.5rem;margin-bottom:8px">🔐</div>
      <div style="font-weight:800;color:var(--am);margin-bottom:6px">منتظر تأیید مدیر باشید</div>
      <div style="font-size:.85rem;color:var(--tx2);line-height:1.7">پس از تأیید مدیر می‌توانید وارد شوید.</div>
    </div>
    <button class="btn" style="width:100%;justify-content:center" onclick="showLogin()">← بازگشت به ورود</button>
  </div>
</div>

<!-- MAIN -->
<div id="mainApp" class="hidden">
  <div class="header">
    <h1>🏋️ ProFit</h1>
    <button class="user-chip" onclick="openDrawer('userDrawer')">
      <span class="avatar" id="userAvatar">💪</span>
      <span id="userName">کاربر</span>
    </button>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div class="card">
    <h2>👋 خوش آمدی</h2>
    <div style="font-size:.9rem;color:var(--tx2);line-height:1.8" id="welcomeMsg"></div>
  </div>
  <div class="card" id="roleCard"></div>
</div>

<!-- DRAWERS -->
<div class="backdrop" id="userBackdrop" onclick="closeDrawer('userDrawer')"></div>
<div class="drawer left" id="userDrawer">
  <div class="drawer-header"><h2>👤 حساب کاربری</h2><button class="close-btn" onclick="closeDrawer('userDrawer')">✕</button></div>
  <div class="drawer-body" id="userDrawerBody"></div>
</div>

<div class="backdrop" id="adminBackdrop" onclick="closeDrawer('adminDrawer')"></div>
<div class="drawer right" id="adminDrawer">
  <div class="drawer-header"><h2>👑 پنل مدیر</h2><button class="close-btn" onclick="closeDrawer('adminDrawer')">✕</button></div>
  <div class="drawer-tabs">
    <button class="tab active" data-atable="pending" onclick="switchAdminTab('pending')">⏳ در انتظار</button>
    <button class="tab" data-atable="users" onclick="switchAdminTab('users')">👥 کاربران</button>
    <button class="tab" data-atable="audit" onclick="switchAdminTab('audit')">📜 لاگ</button>
  </div>
  <div class="drawer-body" id="adminPendingBody"></div>
  <div class="drawer-body hidden" id="adminUsersBody"></div>
  <div class="drawer-body hidden" id="adminAuditBody"></div>
</div>

<div class="backdrop" id="createUserBackdrop" onclick="closeCreateUser()"></div>
<div class="drawer right" id="createUserDrawer" style="z-index:102">
  <div class="drawer-header"><h2>➕ افزودن کاربر</h2><button class="close-btn" onclick="closeCreateUser()">✕</button></div>
  <div class="drawer-body">
    <div class="form-row"><label>نقش</label>
      <select id="newUserRole" onchange="onNewUserRoleChange()">
        <option value="student">🎓 شاگرد</option>
        <option value="coach">👨‍🏫 مربی</option>
        <option value="admin">👑 مدیر</option>
      </select>
    </div>
    <div class="form-row"><label>نام کاربری *</label><input type="text" id="newUserUsername" dir="ltr"></div>
    <div class="form-row"><label>نام نمایشی *</label><input type="text" id="newUserDisplayName"></div>
    <div class="form-row"><label>رمز *</label><input type="password" id="newUserPassword" dir="ltr"></div>
    <div class="form-row" id="newUserCoachRow"><label>مربی (اختیاری)</label><select id="newUserCoachId"></select></div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:8px" onclick="createUser()">💾 ذخیره</button>
  </div>
</div>

<div class="backdrop" id="coachBackdrop" onclick="closeDrawer('coachDrawer')"></div>
<div class="drawer right" id="coachDrawer">
  <div class="drawer-header"><h2>👨‍🏫 پنل مربی</h2><button class="close-btn" onclick="closeDrawer('coachDrawer')">✕</button></div>
  <div class="drawer-body" id="coachBody"></div>
</div>

<div class="backdrop" id="createStudentBackdrop" onclick="closeCreateStudent()"></div>
<div class="drawer right" id="createStudentDrawer" style="z-index:102">
  <div class="drawer-header"><h2>➕ شاگرد جدید</h2><button class="close-btn" onclick="closeCreateStudent()">✕</button></div>
  <div class="drawer-body">
    <div class="form-row"><label>نام کاربری *</label><input type="text" id="newStudentUsername" dir="ltr"></div>
    <div class="form-row"><label>نام نمایشی *</label><input type="text" id="newStudentDisplayName"></div>
    <div class="form-row"><label>رمز *</label><input type="password" id="newStudentPassword" dir="ltr"></div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:8px" onclick="createStudent()">💾 ذخیره</button>
  </div>
</div>

<script>
/* STATE */
const state = {
  token: localStorage.getItem('profit-jwt') || null,
  user: null,
  users: [],
  pending: [],
  students: [],
  audit: [],
  adminTab: 'pending',
  registerRole: 'student'
};

/* API */
async function api(method, path, body, silent) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  const text = await res.text();
  if (text) { try { data = JSON.parse(text); } catch { data = text; } }
  if (!res.ok) {
    const err = new Error((data && data.error) || ('HTTP ' + res.status));
    err.status = res.status;
    err.data = data;
    if (res.status === 401 && !silent && state.token) {
      state.token = null;
      state.user = null;
      localStorage.removeItem('profit-jwt');
      setTimeout(() => location.reload(), 800);
    }
    throw err;
  }
  return data;
}

/* TOAST */
function toast(msg, type) {
  type = type || 'success';
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  el.innerHTML = '<span>' + (icons[type] || '✅') + '</span><span>' + msg + '</span>';
  c.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

/* AUTH UI */
function showRegister() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('registerView').classList.remove('hidden');
  document.getElementById('pendingView').classList.add('hidden');
}
function showLogin() {
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('registerView').classList.add('hidden');
  document.getElementById('pendingView').classList.add('hidden');
}
function showPending() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('registerView').classList.add('hidden');
  document.getElementById('pendingView').classList.remove('hidden');
}
function pickRole(role) {
  state.registerRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('selected', b.dataset.role === role));
  document.getElementById('roleHint').textContent = role === 'coach'
    ? '⚠️ حساب مربی نیاز به تأیید مدیر دارد'
    : 'حساب شاگرد بلافاصله فعال می‌شود';
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.textContent = '';
  if (!u || !p) { err.textContent = 'نام و رمز را وارد کنید'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> ورود...';
  try {
    const r = await api('POST', '/api/auth/login', { username: u, password: p }, true);
    state.token = r.token;
    state.user = r.user;
    localStorage.setItem('profit-jwt', r.token);
    await bootAfterLogin();
  } catch (e) {
    const msg = e.data && e.data.error;
    if (msg === 'pending_approval') { showPending(); return; }
    if (msg === 'invalid_credentials') err.textContent = 'نام کاربری یا رمز اشتباه';
    else if (msg === 'rejected') err.textContent = 'حساب شما رد شده است';
    else if (msg === 'inactive') err.textContent = 'حساب غیرفعال است';
    else err.textContent = 'خطا: ' + (msg || e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'ورود';
  }
}

async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const n = document.getElementById('regName').value.trim();
  const p = document.getElementById('regPass').value;
  const err = document.getElementById('regErr');
  const btn = document.getElementById('regBtn');
  err.textContent = '';
  if (!u || !n || !p) { err.textContent = 'همه فیلدها را پر کنید'; return; }
  if (!/^[a-zA-Z0-9_.-]+$/.test(u)) { err.textContent = 'نام کاربری فقط انگلیسی، عدد، _ . -'; return; }
  if (u.length < 3) { err.textContent = 'نام کاربری حداقل ۳ کاراکتر'; return; }
  if (p.length < 6) { err.textContent = 'رمز حداقل ۶ کاراکتر'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> در حال ایجاد...';
  try {
    const r = await api('POST', '/api/auth/register', { username: u, displayName: n, password: p, requestedRole: state.registerRole }, true);
    if (r.pending) { showPending(); return; }
    state.token = r.token;
    state.user = r.user;
    localStorage.setItem('profit-jwt', r.token);
    await bootAfterLogin();
  } catch (e) {
    const msg = e.data && e.data.error;
    if (msg === 'username_taken') err.textContent = 'این نام کاربری گرفته شده';
    else if (msg === 'invalid_username') err.textContent = 'نام کاربری نامعتبر';
    else if (msg === 'password_too_short') err.textContent = 'رمز کوتاه است';
    else err.textContent = 'خطا: ' + (msg || e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '✅ ایجاد حساب';
  }
}

async function doLogout() {
  if (!confirm('خروج از حساب؟')) return;
  localStorage.removeItem('profit-jwt');
  state.token = null;
  state.user = null;
  location.reload();
}

/* DRAWER */
function openDrawer(id) {
  document.getElementById(id).classList.add('open');
  const bid = id.replace('Drawer', 'Backdrop');
  const b = document.getElementById(bid);
  if (b) b.classList.add('open');
  if (id === 'userDrawer') renderUserDrawer();
  if (id === 'adminDrawer') { renderAdminPending(); renderAdminUsers(); }
  if (id === 'coachDrawer') renderCoachPanel();
}
function closeDrawer(id) {
  document.getElementById(id).classList.remove('open');
  const bid = id.replace('Drawer', 'Backdrop');
  const b = document.getElementById(bid);
  if (b) b.classList.remove('open');
}
function closeAllDrawers() {
  ['userDrawer', 'adminDrawer', 'coachDrawer', 'createUserDrawer', 'createStudentDrawer'].forEach(id => {
    const d = document.getElementById(id);
    const b = document.getElementById(id.replace('Drawer', 'Backdrop'));
    if (d) d.classList.remove('open');
    if (b) b.classList.remove('open');
  });
}

/* MAIN */
function renderMain() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  const u = state.user;
  document.getElementById('userAvatar').textContent = u.emoji || '💪';
  document.getElementById('userAvatar').style.background = u.color || '#3b82f6';
  document.getElementById('userName').textContent = u.displayName;
  const roleLabels = { admin: '👑 مدیر', coach: '👨‍🏫 مربی', student: '🎓 شاگرد' };
  document.getElementById('welcomeMsg').innerHTML =
    'خوش آمدی <strong>' + escapeHtml(u.displayName) + '</strong> عزیز!<br>' +
    'نام کاربری: <code style="direction:ltr">' + escapeHtml(u.username) + '</code><br>' +
    'نقش: <span class="badge ' + u.role + '">' + roleLabels[u.role] + '</span>';
  const tb = document.getElementById('toolbar');
  tb.innerHTML = '';
  if (u.role === 'admin' || u.role === 'coach') {
    const b = document.createElement('button');
    b.className = 'btn coach';
    b.innerHTML = '<span>👨‍🏫</span> پنل مربی';
    b.onclick = () => openDrawer('coachDrawer');
    tb.appendChild(b);
  }
  if (u.role === 'admin') {
    const b = document.createElement('button');
    b.className = 'btn admin';
    b.innerHTML = '<span>👑</span> پنل مدیر';
    b.onclick = () => openDrawer('adminDrawer');
    tb.appendChild(b);
  }
  document.getElementById('roleCard').innerHTML =
    '<h2>🚧 فاز ۱ — در حال ساخت</h2>' +
    '<div style="font-size:.88rem;color:var(--tx2);line-height:1.9">' +
    'این نسخه فاز اول پروژه است: احراز هویت و مدیریت کاربران.<br>' +
    'در فازهای بعدی اضافه می‌شود:' +
    '<ul style="padding-right:20px;margin-top:8px">' +
    '<li>📋 ویرایش برنامه تمرینی</li>' +
    '<li>💪 ثبت وزنه و پیشرفت</li>' +
    '<li>🥗 تغذیه و مکمل</li>' +
    '<li>📏 اندازه‌های بدن</li>' +
    '<li>📊 نمودار پیشرفت</li>' +
    '</ul></div>';
}

/* USER DRAWER */
function renderUserDrawer() {
  const u = state.user;
  const roleLabels = { admin: '👑 مدیر', coach: '👨‍🏫 مربی', student: '🎓 شاگرد' };
  document.getElementById('userDrawerBody').innerHTML =
    '<div class="u-item" style="cursor:default">' +
      '<div class="u-avatar" style="background:' + u.color + '">' + u.emoji + '</div>' +
      '<div class="u-info"><div class="u-name">' + escapeHtml(u.displayName) + '</div>' +
      '<div class="u-meta">@' + escapeHtml(u.username) + ' · ' + roleLabels[u.role] + '</div></div>' +
    '</div>' +
    '<button class="btn danger" style="width:100%;justify-content:center;margin-top:12px" onclick="doLogout()">🚪 خروج از حساب</button>';
}

/* ADMIN */
function switchAdminTab(tab) {
  state.adminTab = tab;
  document.querySelectorAll('[data-atable]').forEach(b => b.classList.toggle('active', b.dataset.atable === tab));
  document.getElementById('adminPendingBody').classList.toggle('hidden', tab !== 'pending');
  document.getElementById('adminUsersBody').classList.toggle('hidden', tab !== 'users');
  document.getElementById('adminAuditBody').classList.toggle('hidden', tab !== 'audit');
  if (tab === 'pending') renderAdminPending();
  if (tab === 'users') renderAdminUsers();
  if (tab === 'audit') renderAdminAudit();
}

async function renderAdminPending() {
  const el = document.getElementById('adminPendingBody');
  el.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  try {
    state.pending = await api('GET', '/api/admin/pending-coaches');
    if (!state.pending.length) {
      el.innerHTML = '<div class="empty"><div class="icon">✅</div><div>درخواستی وجود ندارد</div></div>';
      return;
    }
    el.innerHTML = state.pending.map(u =>
      '<div class="u-item">' +
        '<div class="u-avatar" style="background:' + u.color + '">' + u.emoji + '</div>' +
        '<div class="u-info"><div class="u-name">' + escapeHtml(u.displayName) + '</div>' +
        '<div class="u-meta">@' + escapeHtml(u.username) + ' · ' + new Date(u.createdAt).toLocaleDateString('fa-IR') + '</div></div>' +
        '<div class="u-actions">' +
          '<button class="icon-btn approve" onclick="approveCoach(\'' + u.id + '\')" title="تأیید">✅</button>' +
          '<button class="icon-btn reject" onclick="rejectCoach(\'' + u.id + '\')" title="رد">❌</button>' +
        '</div>' +
      '</div>').join('');
  } catch (e) {
    el.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>خطا: ' + escapeHtml(e.message) + '</div></div>';
  }
}

async function renderAdminUsers() {
  const el = document.getElementById('adminUsersBody');
  el.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  try {
    state.users = await api('GET', '/api/users');
    const groups = { admin: [], coach: [], student: [] };
    state.users.forEach(u => { if (groups[u.role]) groups[u.role].push(u); });
    let html = '<button class="btn primary" style="width:100%;justify-content:center;margin-bottom:16px" onclick="openCreateUser()">➕ افزودن کاربر</button>';
    const order = ['admin', 'coach', 'student'];
    const rl = { admin: '👑 مدیران', coach: '👨‍🏫 مربیان', student: '🎓 شاگردان' };
    const rc = { admin: '#f59e0b', coach: '#3b82f6', student: '#10b981' };
    order.forEach(r => {
      const list = groups[r];
      if (!list.length) return;
      html += '<div style="font-size:.72rem;font-weight:800;color:' + rc[r] + ';margin:14px 0 8px">' + rl[r] + ' (' + list.length + ')</div>';
      html += list.map(u => {
        const coach = u.coachId ? state.users.find(c => c.id === u.coachId) : null;
        const badges = [];
        if (!u.active) badges.push('<span class="badge inactive">غیرفعال</span>');
        if (u.approvalStatus === 'pending') badges.push('<span class="badge pending">در انتظار</span>');
        if (u.approvalStatus === 'rejected') badges.push('<span class="badge rejected">رد شده</span>');
        return '<div class="u-item">' +
          '<div class="u-avatar" style="background:' + u.color + '">' + u.emoji + '</div>' +
          '<div class="u-info"><div class="u-name">' + escapeHtml(u.displayName) + ' ' + badges.join(' ') + '</div>' +
          '<div class="u-meta">@' + escapeHtml(u.username) + (coach ? ' · مربی: ' + escapeHtml(coach.displayName) : '') + '</div></div>' +
          '<div class="u-actions">' +
            '<button class="icon-btn" onclick="resetPassword(\'' + u.id + '\')" title="بازنشانی">🔑</button>' +
            '<button class="icon-btn" onclick="toggleActive(\'' + u.id + '\')" title="' + (u.active ? 'غیرفعال' : 'فعال') + '">' + (u.active ? '🚫' : '✅') + '</button>' +
            '<button class="icon-btn del" onclick="deleteUser(\'' + u.id + '\')" title="حذف">🗑️</button>' +
          '</div>' +
        '</div>';
      }).join('');
    });
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>خطا: ' + escapeHtml(e.message) + '</div></div>';
  }
}

async function renderAdminAudit() {
  const el = document.getElementById('adminAuditBody');
  el.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  try {
    state.audit = await api('GET', '/api/admin/audit');
    if (!state.audit.length) {
      el.innerHTML = '<div class="empty"><div class="icon">📜</div><div>فعالیتی نیست</div></div>';
      return;
    }
    const labels = {
      login_success: '✅ ورود موفق', login_failed: '❌ ورود ناموفق',
      user_created: '➕ ساخت کاربر', user_updated: '✏️ ویرایش',
      user_deleted: '🗑️ حذف کاربر', password_changed: '🔑 تغییر رمز',
      user_registered: '✨ ثبت‌نام', coach_approved: '✅ تأیید مربی', coach_rejected: '❌ رد مربی'
    };
    el.innerHTML = state.audit.map(r => {
      const actor = state.users.find(x => x.id === r.actor_id);
      const actorName = actor ? actor.displayName : (r.actor_id || 'سیستم');
      return '<div style="padding:10px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;font-size:.78rem">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><strong>' + (labels[r.action] || r.action) + '</strong>' +
        '<span style="color:var(--tm);font-size:.7rem">' + new Date(r.created_at).toLocaleString('fa-IR') + '</span></div>' +
        '<div style="color:var(--tx2)">' + escapeHtml(actorName) + '</div></div>';
    }).join('');
  } catch (e) {
    el.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>خطا: ' + escapeHtml(e.message) + '</div></div>';
  }
}

async function approveCoach(id) {
  if (!confirm('تأیید شود؟')) return;
  try { await api('POST', '/api/admin/approve/' + id); toast('تأیید شد'); renderAdminPending(); renderAdminUsers(); }
  catch (e) { toast('خطا: ' + e.message, 'error'); }
}
async function rejectCoach(id) {
  if (!confirm('رد شود؟')) return;
  try { await api('POST', '/api/admin/reject/' + id); toast('رد شد', 'info'); renderAdminPending(); renderAdminUsers(); }
  catch (e) { toast('خطا: ' + e.message, 'error'); }
}
async function deleteUser(id) {
  const u = state.users.find(x => x.id === id);
  if (!u) return;
  if (!confirm('حذف «' + u.displayName + '»؟')) return;
  const pw = prompt('رمز خود (مدیر) را وارد کنید:');
  if (!pw) return;
  try { await api('DELETE', '/api/users/' + id, { adminPassword: pw }); toast('حذف شد'); renderAdminUsers(); renderAdminPending(); }
  catch (e) {
    const msg = e.data && e.data.error;
    if (msg === 'wrong_password') toast('رمز اشتباه', 'error');
    else toast('خطا: ' + e.message, 'error');
  }
}
async function toggleActive(id) {
  const u = state.users.find(x => x.id === id);
  if (!u) return;
  if (!confirm((u.active ? 'غیرفعال' : 'فعال') + ' شود؟')) return;
  try { await api('PUT', '/api/users/' + id, { active: !u.active }); toast('انجام شد'); renderAdminUsers(); }
  catch (e) { toast('خطا: ' + e.message, 'error'); }
}
async function resetPassword(id) {
  const u = state.users.find(x => x.id === id);
  if (!u) return;
  const np = prompt('رمز جدید برای «' + u.displayName + '» (حداقل ۶):');
  if (!np) return;
  if (np.length < 6) { toast('حداقل ۶ کاراکتر', 'error'); return; }
  try { await api('PUT', '/api/users/' + id, { password: np }); toast('رمز تغییر کرد'); }
  catch (e) { toast('خطا: ' + e.message, 'error'); }
}

function openCreateUser() {
  document.getElementById('newUserUsername').value = '';
  document.getElementById('newUserDisplayName').value = '';
  document.getElementById('newUserPassword').value = '';
  document.getElementById('newUserRole').value = 'student';
  onNewUserRoleChange();
  const sel = document.getElementById('newUserCoachId');
  const coaches = state.users.filter(u => u.role === 'coach' || u.role === 'admin');
  sel.innerHTML = '<option value="">— بدون —</option>' + coaches.map(c => '<option value="' + c.id + '">' + c.emoji + ' ' + escapeHtml(c.displayName) + '</option>').join('');
  openDrawer('createUserDrawer');
}
function closeCreateUser() { closeDrawer('createUserDrawer'); }
function onNewUserRoleChange() {
  const r = document.getElementById('newUserRole').value;
  document.getElementById('newUserCoachRow').style.display = r === 'student' ? 'block' : 'none';
}
async function createUser() {
  const username = document.getElementById('newUserUsername').value.trim();
  const displayName = document.getElementById('newUserDisplayName').value.trim();
  const password = document.getElementById('newUserPassword').value;
  const role = document.getElementById('newUserRole').value;
  const coachId = document.getElementById('newUserCoachId').value || null;
  if (!username || !displayName || !password) { toast('همه فیلدها را پر کنید', 'error'); return; }
  if (!/^[a-zA-Z0-9_.-]+$/.test(username)) { toast('نام کاربری نامعتبر', 'error'); return; }
  if (password.length < 6) { toast('رمز حداقل ۶', 'error'); return; }
  try {
    await api('POST', '/api/users', { username, displayName, password, role, coachId: role === 'student' ? coachId : null });
    toast('کاربر ساخته شد');
    closeCreateUser();
    renderAdminUsers();
  } catch (e) {
    const msg = e.data && e.data.error;
    if (msg === 'username_taken') toast('نام کاربری تکراری', 'error');
    else if (msg === 'invalid_username') toast('نام کاربری نامعتبر', 'error');
    else toast('خطا: ' + (msg || e.message), 'error');
  }
}

/* COACH */
async function renderCoachPanel() {
  const el = document.getElementById('coachBody');
  el.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  try {
    state.students = await api('GET', '/api/coach/students');
    let html = '<button class="btn primary" style="width:100%;justify-content:center;margin-bottom:16px" onclick="openCreateStudent()">➕ شاگرد جدید</button>';
    if (!state.students.length) {
      html += '<div class="empty"><div class="icon">👥</div><div>هنوز شاگردی نداری</div></div>';
    } else {
      html += '<div style="font-weight:800;margin-bottom:12px">👥 ' + state.students.length + ' شاگرد</div>';
      html += state.students.map(s =>
        '<div class="u-item">' +
          '<div class="u-avatar" style="background:' + s.color + '">' + s.emoji + '</div>' +
          '<div class="u-info"><div class="u-name">' + escapeHtml(s.displayName) + '</div>' +
          '<div class="u-meta">@' + escapeHtml(s.username) + '</div></div>' +
        '</div>').join('');
    }
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>خطا: ' + escapeHtml(e.message) + '</div></div>';
  }
}
function openCreateStudent() {
  document.getElementById('newStudentUsername').value = '';
  document.getElementById('newStudentDisplayName').value = '';
  document.getElementById('newStudentPassword').value = '';
  openDrawer('createStudentDrawer');
}
function closeCreateStudent() { closeDrawer('createStudentDrawer'); }
async function createStudent() {
  const username = document.getElementById('newStudentUsername').value.trim();
  const displayName = document.getElementById('newStudentDisplayName').value.trim();
  const password = document.getElementById('newStudentPassword').value;
  if (!username || !displayName || !password) { toast('همه فیلدها را پر کنید', 'error'); return; }
  if (!/^[a-zA-Z0-9_.-]+$/.test(username)) { toast('نام کاربری نامعتبر', 'error'); return; }
  if (password.length < 6) { toast('رمز حداقل ۶', 'error'); return; }
  try {
    await api('POST', '/api/users', { username, displayName, password, role: 'student' });
    toast('شاگرد ساخته شد ✓');
    closeCreateStudent();
    renderCoachPanel();
  } catch (e) {
    const msg = e.data && e.data.error;
    if (msg === 'username_taken') toast('نام کاربری تکراری', 'error');
    else if (msg === 'invalid_username') toast('نام کاربری نامعتبر', 'error');
    else if (msg === 'forbidden') toast('دسترسی ندارید', 'error');
    else toast('خطا: ' + (msg || e.message), 'error');
  }
}

/* UTILS */
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/* BOOT */
async function bootAfterLogin() {
  renderMain();
  if (state.user.role === 'admin') {
    try { state.users = await api('GET', '/api/users'); } catch (e) {}
    try { state.pending = await api('GET', '/api/admin/pending-coaches'); } catch (e) {}
  }
}

async function boot() {
  if (!state.token) return;
  try {
    state.user = await api('GET', '/api/auth/me', null, true);
    await bootAfterLogin();
  } catch (e) {
    localStorage.removeItem('profit-jwt');
    state.token = null;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAllDrawers();
  if (e.key === 'Enter') {
    if (!document.getElementById('loginView').classList.contains('hidden')) doLogin();
    else if (!document.getElementById('registerView').classList.contains('hidden')) doRegister();
  }
});

boot();
</script>
